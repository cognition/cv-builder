<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CV Variants</title>
<link rel="stylesheet" href="/cv/web/builder.css">
</head>
<body class="builder">
  <header class="builder-header">
    <div>
      <h1>CV Variants</h1>
      <p class="subtitle">
        Manage composed CVs under <code>cv/variants/</code> — preview PDFs,
        re-render from their <code>data.yaml</code>, or delete.
      </p>
    </div>
    <nav class="builder-nav">
      <a href="/cv/web/edit">Editor</a>
      <a href="/cv/web/build">Builder</a>
      <a href="/cv/web/docs">How to use</a>
      <button type="button" id="btn-refresh">Refresh</button>
    </nav>
  </header>

  <section class="builder-controls">
    <span id="variants-status">Loading…</span>
  </section>

  <table class="variants-table" id="variants-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Updated</th>
        <th>PDF</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="variants-body"></tbody>
  </table>

  <div id="preview-pane">
    <iframe id="preview-frame" src="about:blank" title="PDF preview"></iframe>
  </div>

  <script src="/cv/web/variants.js"></script>
</body>
</html>
